<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    #gameBoard {
      border: 2px solid #333;
      background-color: #fff;
    }
  </style>
</head>

<body>
  <div class="container text-center">
    <h1 class="mb-4">Snake Game</h1>
    <canvas id="gameBoard" width="400" height="400"></canvas>
    <div class="mt-3">
      <button id="startButton" class="btn btn-primary">Start Game</button>
      <p class="mt-2">Score: <span id="score">0</span></p>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameBoard");
    const ctx = canvas.getContext("2d");
    const box = 20;
    const boardSize = 20;
    let snake;
    let food;
    let score;
    let direction;
    let gameInterval;

    document.getElementById("startButton").addEventListener("click", startGame);

    function startGame() {
      snake = [{ x: 9 * box, y: 9 * box }];
      food = {
        x: Math.floor(Math.random() * boardSize) * box,
        y: Math.floor(Math.random() * boardSize) * box
      };
      score = 0;
      direction = "RIGHT";
      document.getElementById("score").textContent = score;
      clearInterval(gameInterval);
      gameInterval = setInterval(draw, 150); // Reduced speed (slower snake)
      document.addEventListener("keydown", changeDirection);
    }

    function changeDirection(event) {
      const key = event.keyCode;
      if (key === 37 && direction !== "RIGHT") direction = "LEFT";
      else if (key === 38 && direction !== "DOWN") direction = "UP";
      else if (key === 39 && direction !== "LEFT") direction = "RIGHT";
      else if (key === 40 && direction !== "UP") direction = "DOWN";
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < snake.length; i++) {
        ctx.fillStyle = i === 0 ? "green" : "lightgreen";
        ctx.fillRect(snake[i].x, snake[i].y, box, box);
        ctx.strokeStyle = "white";
        ctx.strokeRect(snake[i].x, snake[i].y, box, box);
      }

      ctx.fillStyle = "red";
      ctx.fillRect(food.x, food.y, box, box);

      let head = { x: snake[0].x, y: snake[0].y };
      if (direction === "LEFT") head.x -= box;
      if (direction === "UP") head.y -= box;
      if (direction === "RIGHT") head.x += box;
      if (direction === "DOWN") head.y += box;

      // Collision detection
      if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height || collision(head, snake)) {
        clearInterval(gameInterval);
        alert("Game Over! Your score: " + score);
        return;
      }

      // Eat food
      if (head.x === food.x && head.y === food.y) {
        score++;
        document.getElementById("score").textContent = score;
        food = {
          x: Math.floor(Math.random() * boardSize) * box,
          y: Math.floor(Math.random() * boardSize) * box
        };
      } else {
        snake.pop();
      }

      snake.unshift(head);
    }

    function collision(head, array) {
      for (let i = 0; i < array.length; i++) {
        if (head.x === array[i].x && head.y === array[i].y) return true;
      }
      return false;
    }
  </script>
</body>

</html>
